name: ci
on:
    workflow_dispatch:
    push:
        branches:
            - main

permissions: {}

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    release-please:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            releases_created: ${{ steps.release.outputs.releases_created }}
            release_tag_name: ${{ steps.release.outputs['tag_name'] }}
            release_version: ${{ steps.release.outputs['version'] }}
            release_upload_url: ${{ steps.release.outputs['upload_url'] }}
        env:
            GITHUB_REF: ${{ github.ref }}
        steps:
            - name: Show github.ref
              run: echo "$GITHUB_REF"

            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              id: release
              if: github.repository_owner == 'ptarmiganlabs'
              with:
                  token: ${{ secrets.RELEASE_PLEASE_PAT }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
                  target-branch: main

            - name: Show output from Release-Please
              if: always()
              env:
                  RELEASE_PLEASE_OUTPUT: ${{ toJSON(steps.release.outputs) }}
              run: echo "$RELEASE_PLEASE_OUTPUT"

    build-release:
        needs: release-please
        runs-on: ubuntu-latest
        if: needs.release-please.outputs.releases_created == 'true'
        permissions:
            contents: write
        env:
            DIST_FILE_NAME: onboard-qs
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 22
                  package-manager-cache: false

            - name: Install dependencies
              run: npm ci

            - name: Build production zip
              run: npm run pack:prod

            - name: Assemble release package
              env:
                  VERSION: ${{ needs.release-please.outputs.release_version }}
              run: |
                  # Create staging directory
                  mkdir -p release-staging

                  # Copy the extension zip (the file users upload to Sense)
                  cp "${DIST_FILE_NAME}.zip" "release-staging/${DIST_FILE_NAME}.zip"

                  # Generate readme.txt from template with version injected
                  sed "s/__VERSION__/${VERSION}/g" release-config/readme-template.txt > release-staging/readme.txt

                  # Copy LICENSE
                  cp LICENSE release-staging/LICENSE

                  # Copy README.pdf
                  cp README.pdf release-staging/README.pdf

                  # Create the outer release zip
                  cd release-staging
                  zip -r "../${DIST_FILE_NAME}-v${VERSION}.zip" .
                  cd ..

            - name: List release zip contents (debug)
              env:
                  RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
              run: |
                  echo "=== Outer release zip ==="
                  zipinfo "${DIST_FILE_NAME}-v${RELEASE_VERSION}.zip"
                  echo ""
                  echo "=== Inner extension zip ==="
                  zipinfo "release-staging/${DIST_FILE_NAME}.zip"

                        - name: Generate CycloneDX SBOM
                            env:
                                    RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
                            run: |
                                    SBOM_FILE="${DIST_FILE_NAME}-v${RELEASE_VERSION}.sbom.cdx.json"

                                    ./node_modules/.bin/cyclonedx-npm \
                                        --omit dev \
                                        --output-reproducible \
                                        --output-format JSON \
                                        --output-file "${SBOM_FILE}"

                                    test -s "${SBOM_FILE}" || { echo "SBOM file missing or empty"; exit 1; }

            - name: Upload release artifacts
              uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
              with:
                  allowUpdates: true
                  omitBodyDuringUpdate: true
                  omitNameDuringUpdate: true
                  omitDraftDuringUpdate: true
                  tag: ${{ needs.release-please.outputs.release_tag_name }}
                  token: ${{ secrets.RELEASE_PLEASE_PAT }}
                  artifacts: |
                      ${{ env.DIST_FILE_NAME }}-v${{ needs.release-please.outputs.release_version }}.zip
                      ${{ env.DIST_FILE_NAME }}-v${{ needs.release-please.outputs.release_version }}.sbom.cdx.json
