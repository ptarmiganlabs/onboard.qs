<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140" role="img" aria-labelledby="t">
  <title id="t">Onboard.qs</title>
  <defs>
    <!-- Dark card: the hue taken most of the way to black, still carrying it.
         Not neutral grey — a neutral dark card makes the glyph look pasted on. -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E3A22"/>
      <stop offset="100%" stop-color="#042011"/>
    </linearGradient>
    <!-- LIFTED green. At #00B050 -> #007A38 the crown's lower half closes on
         the card's value and the cap loses its base. Both stops raised one
         step; the V still falls where the board's dark meets the crown's
         light, because each shape still ramps across its own box. -->
    <linearGradient id="iconGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FD98E"/>
      <stop offset="100%" stop-color="#00B050"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="132" height="132" rx="16" ry="16" fill="url(#bgGrad)"/>

  <!-- ============================ GLYPH ============================
       Same geometry as the logo. Only the gradients and the wordmark colour
       change. There is no knocked-out interior detail to invert here: the
       cap's one interior edge is the V, and that is made by the two shapes'
       own gradients rather than by a hole, so it survives the lift
       untouched. -->
  <path d="M42 46 V78 C42 89 57.5 96 70 96 C82.5 96 98 89 98 78 V46 Z"
        fill="url(#iconGrad)"/>
  <rect x="102.8" y="46" width="2.4" height="30" rx="1.2" fill="url(#iconGrad)"/>
  <circle cx="104" cy="78" r="3.8" fill="url(#iconGrad)"/>
  <path d="M70 18 L114 43.5 L70 63.5 L26 43.5 Z" fill="url(#iconGrad)"/>
  <!-- ========================== end GLYPH ========================== -->

  <!-- Wordmark lifted well clear of the card. The light card's deep wordmark
       colour is unreadable here; that is the whole reason this file exists. -->
  <text x="70" y="112" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="12" font-weight="600" fill="#A7F3CA">
    Onboard.qs
  </text>
</svg>
