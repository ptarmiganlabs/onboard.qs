<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">Onboard.qs — interactive onboarding tours for Qlik Sense apps</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFFAF3"/>
      <stop offset="100%" stop-color="#E1F5E8"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00B050"/>
      <stop offset="100%" stop-color="#007A38"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- The lockup, scaled 2x and centred. 364 wide at 2x is 728; (1200-728)/2
       is 236. Recompute both if you changed the lockup's width. -->
  <g transform="translate(242 150) scale(2)">
    <g transform="translate(10 18) scale(1.03) translate(-26 -18)">
      <path d="M42 46 V78 C42 89 57.5 96 70 96 C82.5 96 98 89 98 78 V46 Z"
            fill="url(#iconGrad)"/>
      <rect x="102.8" y="46" width="2.4" height="30" rx="1.2" fill="url(#iconGrad)"/>
      <circle cx="104" cy="78" r="3.8" fill="url(#iconGrad)"/>
      <path d="M70 18 L114 43.5 L70 63.5 L26 43.5 Z" fill="url(#iconGrad)"/>
    </g>
    <text x="120" y="73" text-anchor="start"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="42" font-weight="600" fill="#007A38">Onboard.qs</text>
  </g>

  <!-- Tagline. Two lines at 36 px rather than one long one: this card is shown
       at perhaps 500 px wide in a chat client, and a single line of this length
       sets too small to read there. Say what the tool does, not what it is. -->
  <text x="600" y="455" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="400" fill="#007A38">Interactive onboarding tours</text>
  <text x="600" y="503" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="400" fill="#007A38">for Qlik Sense apps</text>

  <!-- Accent bar. A tool with a data palette of its own can carry the full
       palette here instead, as a row of equal segments — it is the one place on
       the card with room for it. Otherwise keep it to the tool's hue. -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#iconGrad)"/>
</svg>
